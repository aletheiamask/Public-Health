<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หาอนามัยใกล้บ้าน มือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700&amp;family=Noto+Sans+Thai+Looped:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit}
a{color:inherit}
.h{font-family:'Kanit','Noto Sans Thai Looped',sans-serif;letter-spacing:-0.01em}
.press{transition:transform .12s}.press:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .3s cubic-bezier(.2,.7,.2,1) both}
a:focus-visible,button:focus-visible{outline:3px solid #FFC83D;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1900px; position: relative; overflow: hidden; background: #F4F7FF; font-family: 'Noto Sans Thai Looped', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #0B1533;">
 <div style="zoom: {{zoom}};">
  <header style="padding: 12px 12px 4px; display: flex; align-items: center; gap: 8px;">
    <a href="HomeMobile.dc.html" class="press" style="height: 48px; padding: 0 16px 0 10px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E3E8F5; text-decoration: none; font-weight: 700; display: flex; gap: 4px; align-items: center;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>กลับ</a>
  </header>
  <div style="padding: 8px 16px 40px; display: flex; flex-direction: column; gap: 16px;">
    <div>
      <h1 class="h" style="margin: 0; font-size: 32px; line-height: 1.25;">อนามัยใกล้บ้าน</h1>
      <p style="margin: 4px 0 0; color: #3A4664; font-size: 17px;">รพ.สต. 64 แห่ง และโรงพยาบาล 7 แห่ง ครบ 7 อำเภอ</p>
    </div>

    <div style="border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1.5px #E3E8F5;">
      <svg role="img" aria-label="แผนที่ย่อ แสดงตำแหน่งของคุณและอนามัยใกล้เคียง" width="100%" height="160" viewBox="0 0 358 160" preserveAspectRatio="xMidYMid slice"><rect width="358" height="160" fill="#CFE0FF"></rect><path d="M0 0h230c-20 30 10 50-10 80s20 50 0 80H0z" fill="#E6EDFF"></path><circle cx="290" cy="60" r="20" fill="#E6EDFF"></circle><circle cx="320" cy="128" r="11" fill="#E6EDFF"></circle><path d="M40 0v160M0 70h220M120 0l-30 160" stroke="#FFFFFF" stroke-width="5"></path><circle cx="{{loc.x}}" cy="{{loc.y}}" r="11" fill="#0B1533" stroke="#FFFFFF" stroke-width="3"></circle><circle cx="70" cy="50" r="7" fill="#2457FF"></circle><circle cx="160" cy="110" r="7" fill="#2457FF"></circle><circle cx="285" cy="52" r="7" fill="#2457FF"></circle><circle cx="320" cy="128" r="6" fill="#2457FF"></circle></svg>
      <div style="padding: 10px 14px; background: #FFFFFF; font-size: 16px; display: flex; justify-content: space-between; align-items: center; gap: 8px;"><span>ตำแหน่งของคุณ: <strong>{{loc.name}}</strong></span><button type="button" class="press" onClick="{{nextLoc}}" style="height: 44px; padding: 0 14px; border-radius: 12px; border: 0; background: #EEF2FB; font-size: 16px; font-weight: 700; color: #0B1533; cursor: pointer;">เปลี่ยน</button></div>
    </div>

    <div role="group" aria-label="อำเภอ" style="display: flex; gap: 6px; flex-wrap: wrap;">
      <sc-for list="{{ds}}" as="d" hint-placeholder-count="8">
        <button type="button" aria-pressed="{{d.pressed}}" class="press" onClick="{{d.pick}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: {{d.bg}}; color: {{d.fg}}; box-shadow: 0 0 0 1.5px {{d.ring}}; font-size: 16px; font-weight: 700; cursor: pointer;">{{d.label}}</button>
      </sc-for>
    </div>
    <button type="button" role="switch" aria-checked="{{openChecked}}" onClick="{{toggleOpen}}" style="display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 18px; border: 0; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E3E8F5; color: #0B1533; font-size: 17px; font-weight: 700; cursor: pointer;"><span style="flex: 1; text-align: left;">เฉพาะที่เปิดอยู่ตอนนี้</span><span aria-hidden="true" style="width: 52px; height: 30px; border-radius: 999px; background: {{openBg}}; padding: 3px;"><span style="display: block; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; transform: translateX({{openX}}); transition: transform .2s;"></span></span></button>

    <p role="status" style="margin: 0; font-size: 16px; color: #3A4664;">พบ {{count}} แห่ง · เรียงจากใกล้ที่สุด</p>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{items}}" as="c" hint-placeholder-count="4">
        <li class="rise" style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E3E8F5; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; gap: 10px; align-items: flex-start;">
            <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.4;"><span class="h" style="font-size: 20px; font-weight: 700;">{{c.name}}</span><span style="font-size: 16px; color: #5A6482;">อ.{{c.district}} · {{c.dist}}</span></span>
            <span style="padding: 2px 10px; border-radius: 999px; background: {{c.stBg}}; color: {{c.stFg}}; font-size: 15px; font-weight: 700; white-space: nowrap;">{{c.status}}</span>
          </div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <sc-for list="{{c.tags}}" as="t" hint-placeholder-count="2"><span style="padding: 0 10px; border-radius: 999px; background: #EEF2FB; font-size: 16px;">{{t}}</span></sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <a href="{{c.tel}}" class="press" style="height: 52px; border-radius: 16px; background: #E6EDFF; color: #1D3FD1; text-decoration: none; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"></path></svg>โทร</a>
            <a href="{{c.map}}" target="_blank" rel="noopener" class="press" style="height: 52px; border-radius: 16px; background: #2457FF; color: #FFFFFF; text-decoration: none; font-weight: 700; display: flex; align-items: center; justify-content: center;">นำทาง</a>
          </div>
        </li>
      </sc-for>
    </ul>
  </div>
 </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let big = false;
    try { big = window.localStorage.getItem('trat-big-text') === '1'; } catch (e) {}
    this.state = { d: 'near', open: false, loc: 0, big };
  }
  renderVals() {
    const locs = [
      { name: 'ต.วังกระแจะ อ.เมือง', district: 'เมืองตราด', x: 110, y: 80 },
      { name: 'ต.เกาะช้าง อ.เกาะช้าง', district: 'เกาะช้าง', x: 290, y: 60 },
      { name: 'ต.หาดเล็ก อ.คลองใหญ่', district: 'คลองใหญ่', x: 80, y: 140 }
    ];
    const loc = locs[this.state.loc];
    const all = [
      { name: 'รพ.สต.วังกระแจะ', district: 'เมืองตราด', km: 0.6, open: true, tags: ['ฉีดวัคซีน', 'คลินิกเบาหวาน'], tel: 'tel:039511302' },
      { name: 'รพ.สต.บ้านท่าเรือ', district: 'เมืองตราด', km: 1.2, open: true, tags: ['ฉีดวัคซีน', 'ทันตกรรมวันพุธ'], tel: 'tel:039511301' },
      { name: 'โรงพยาบาลตราด', district: 'เมืองตราด', km: 3.4, open: true, tags: ['ฉุกเฉิน 24 ชม.', 'คลินิกเลิกบุหรี่'], tel: 'tel:039511040' },
      { name: 'รพ.สต.หนองเสม็ด', district: 'เมืองตราด', km: 5.1, open: false, tags: ['ฉีดวัคซีน'], tel: 'tel:039511303' },
      { name: 'รพ.สต.บ้านสลักเพชร', district: 'เกาะช้าง', km: 0.9, open: true, tags: ['ฉีดวัคซีน', 'ส่งต่อทางเรือ'], tel: 'tel:039511601' },
      { name: 'โรงพยาบาลเกาะช้าง', district: 'เกาะช้าง', km: 6.5, open: true, tags: ['ฉุกเฉิน 24 ชม.', 'ล่ามภาษาอังกฤษ'], tel: 'tel:039511600' },
      { name: 'รพ.สต.บ้านหาดเล็ก', district: 'คลองใหญ่', km: 0.4, open: true, tags: ['ฉีดวัคซีน', 'ล่ามภาษากัมพูชา'], tel: 'tel:039511401' },
      { name: 'โรงพยาบาลคลองใหญ่', district: 'คลองใหญ่', km: 12, open: true, tags: ['ฉุกเฉิน 24 ชม.'], tel: 'tel:039511400' },
      { name: 'รพ.สต.วังตะเคียน', district: 'เขาสมิง', km: 2.2, open: true, tags: ['ฉีดวัคซีน'], tel: 'tel:039511701' },
      { name: 'รพ.สต.ด่านชุมพล', district: 'บ่อไร่', km: 3.0, open: true, tags: ['ฉีดวัคซีน', 'คลินิกมาลาเรีย'], tel: 'tel:039511801' },
      { name: 'รพ.สต.น้ำเชี่ยว', district: 'แหลมงอบ', km: 1.5, open: false, tags: ['ฉีดวัคซีน'], tel: 'tel:039511901' },
      { name: 'รพ.สต.อ่าวพร้าว', district: 'เกาะกูด', km: 2.8, open: true, tags: ['ฉีดวัคซีน', 'ส่งต่อทางเรือ'], tel: 'tel:039511501' }
    ];
    const defs = [['near', 'ใกล้ฉัน'], ['เมืองตราด', 'เมือง'], ['เขาสมิง', 'เขาสมิง'], ['บ่อไร่', 'บ่อไร่'], ['คลองใหญ่', 'คลองใหญ่'], ['แหลมงอบ', 'แหลมงอบ'], ['เกาะช้าง', 'เกาะช้าง'], ['เกาะกูด', 'เกาะกูด']];
    const ds = defs.map(([k, label]) => {
      const on = this.state.d === k;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#0B1533' : '#FFFFFF', fg: on ? '#FFFFFF' : '#0B1533', ring: on ? '#0B1533' : '#E3E8F5', pick: () => this.setState({ d: k }) };
    });
    const want = this.state.d === 'near' ? loc.district : this.state.d;
    let items = all.filter((c) => c.district === want).sort((a, b) => a.km - b.km);
    if (this.state.open) items = items.filter((c) => c.open);
    items = items.map((c) => Object.assign({}, c, {
      dist: c.km + ' กม.',
      map: 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(c.name + ' ตราด'),
      status: c.open ? 'เปิดอยู่ ถึง 16:30' : 'ปิดแล้ว', stBg: c.open ? '#D9F7EA' : '#EEF2FB', stFg: c.open ? '#0E6B52' : '#3A4664'
    }));
    const open = this.state.open;
    return {
      zoom: this.state.big ? 1.3 : 1,
      loc, ds, items, count: items.length,
      nextLoc: () => this.setState({ loc: (this.state.loc + 1) % locs.length, d: 'near' }),
      openChecked: open ? 'true' : 'false', openBg: open ? '#2457FF' : '#C3CBE0', openX: open ? '22px' : '0px',
      toggleOpen: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
