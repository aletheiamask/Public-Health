<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>หาอนามัยใกล้บ้าน มือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Noto+Sans+Thai+Looped:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit}
a{color:inherit}
.h{font-family:'Anuphan','Noto Sans Thai Looped',sans-serif;letter-spacing:-0.01em}
.press{transition:transform .12s}.press:active{transform:scale(.96)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rise{animation:rise .3s cubic-bezier(.2,.7,.2,1) both}
a:focus-visible,button:focus-visible{outline:3px solid #F4A23C;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1900px; position: relative; overflow: hidden; background: #FBF7F0; font-family: 'Noto Sans Thai Looped', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #10242A;">
  <header style="padding: 12px 12px 4px; display: flex; align-items: center; gap: 8px;">
    <a href="HomeMobile.dc.html" class="press" style="height: 48px; padding: 0 16px 0 10px; border-radius: 999px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E8E1D4; text-decoration: none; font-weight: 700; display: flex; gap: 4px; align-items: center;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>กลับ</a>
  </header>
  <div style="padding: 8px 16px 40px; display: flex; flex-direction: column; gap: 16px;">
    <div>
      <h1 class="h" style="margin: 0; font-size: 32px; line-height: 1.25;">อนามัยใกล้บ้าน</h1>
      <p style="margin: 4px 0 0; color: #3B5157; font-size: 17px;">รพ.สต. 64 แห่ง และโรงพยาบาล 7 แห่งทั่วตราด</p>
    </div>

    <div style="border-radius: 24px; overflow: hidden; box-shadow: 0 0 0 1.5px #E8E1D4;">
      <svg role="img" aria-label="แผนที่ย่อจังหวัดตราด แสดงตำแหน่งคุณและอนามัยใกล้เคียง" width="100%" height="170" viewBox="0 0 358 170" preserveAspectRatio="xMidYMid slice"><rect width="358" height="170" fill="#BFE6E4"></rect><path d="M0 0h230c-20 30 10 50-10 80s20 50 0 90H0z" fill="#EFE6D6"></path><circle cx="290" cy="60" r="18" fill="#EFE6D6"></circle><circle cx="320" cy="130" r="10" fill="#EFE6D6"></circle><path d="M40 0v170M0 70h220M120 0l-30 170" stroke="#FFFFFF" stroke-width="5"></path><circle cx="110" cy="80" r="10" fill="#10242A" stroke="#FFFFFF" stroke-width="3"></circle><circle cx="70" cy="50" r="8" fill="#0E6E7E"></circle><circle cx="160" cy="110" r="8" fill="#0E6E7E"></circle><circle cx="190" cy="40" r="8" fill="#0E6E7E"></circle><circle cx="290" cy="60" r="7" fill="#0E6E7E"></circle></svg>
      <div style="padding: 10px 14px; background: #FFFFFF; font-size: 15px; display: flex; justify-content: space-between; align-items: center;"><span>ตำแหน่งของคุณ: ต.วังกระแจะ</span><button type="button" class="press" style="height: 40px; padding: 0 12px; border-radius: 12px; border: 0; background: #F3EDE2; font-size: 14px; font-weight: 700; color: #10242A;">เปลี่ยน</button></div>
    </div>

    <div role="group" aria-label="อำเภอ" style="display: flex; gap: 6px; flex-wrap: wrap;">
      <sc-for list="{{ds}}" as="d" hint-placeholder-count="4">
        <button type="button" aria-pressed="{{d.pressed}}" class="press" onClick="{{d.pick}}" style="height: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: {{d.bg}}; color: {{d.fg}}; box-shadow: 0 0 0 1.5px {{d.ring}}; font-size: 16px; font-weight: 700; cursor: pointer;">{{d.label}}</button>
      </sc-for>
    </div>
    <button type="button" role="switch" aria-checked="{{openChecked}}" onClick="{{toggleOpen}}" style="display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 18px; border: 0; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E8E1D4; color: #10242A; font-size: 17px; font-weight: 700; cursor: pointer;"><span style="flex: 1; text-align: left;">เฉพาะที่เปิดอยู่ตอนนี้</span><span aria-hidden="true" style="width: 52px; height: 30px; border-radius: 999px; background: {{openBg}}; padding: 3px;"><span style="display: block; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; transform: translateX({{openX}}); transition: transform .2s;"></span></span></button>

    <p role="status" style="margin: 0; font-size: 16px; color: #3B5157;">พบ {{count}} แห่ง · เรียงจากใกล้ที่สุด</p>
    <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
      <sc-for list="{{items}}" as="c" hint-placeholder-count="4">
        <li class="rise" style="border-radius: 24px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E8E1D4; padding: 16px; display: flex; flex-direction: column; gap: 10px;">
          <div style="display: flex; gap: 10px; align-items: flex-start;">
            <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.4;"><span class="h" style="font-size: 20px; font-weight: 700;">{{c.name}}</span><span style="font-size: 15px; color: #56696E;">อ.{{c.district}} · {{c.dist}}</span></span>
            <span style="padding: 2px 10px; border-radius: 999px; background: {{c.stBg}}; color: {{c.stFg}}; font-size: 14px; font-weight: 700; white-space: nowrap;">{{c.status}}</span>
          </div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <sc-for list="{{c.tags}}" as="t" hint-placeholder-count="2"><span style="padding: 0 10px; border-radius: 999px; background: #F3EDE2; font-size: 14px;">{{t}}</span></sc-for>
          </div>
          <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
            <a href="{{c.tel}}" class="press" style="height: 52px; border-radius: 16px; background: #DDF1F1; color: #0A4B57; text-decoration: none; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px;"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6.6 10.8a15 15 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"></path></svg>โทร</a>
            <a href="#" class="press" style="height: 52px; border-radius: 16px; background: #0E6E7E; color: #FFFFFF; text-decoration: none; font-weight: 700; display: flex; align-items: center; justify-content: center;">นำทาง</a>
          </div>
        </li>
      </sc-for>
    </ul>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { d: 'near', open: false };
  }
  renderVals() {
    const all = [
      { name: 'รพ.สต.บ้านท่าเรือ', district: 'เมืองตราด', dist: '1.2 กม.', open: true, tags: ['ฉีดวัคซีน', 'ทันตกรรมวันพุธ'], tel: 'tel:039511301' },
      { name: 'รพ.สต.วังกระแจะ', district: 'เมืองตราด', dist: '0.6 กม.', open: true, tags: ['ฉีดวัคซีน', 'คลินิกเบาหวาน'], tel: 'tel:039511302' },
      { name: 'รพ.สต.หนองเสม็ด', district: 'เมืองตราด', dist: '5.1 กม.', open: false, tags: ['ฉีดวัคซีน'], tel: 'tel:039511303' },
      { name: 'โรงพยาบาลตราด', district: 'เมืองตราด', dist: '3.4 กม.', open: true, tags: ['ฉุกเฉิน 24 ชม.', 'คลินิกเลิกบุหรี่'], tel: 'tel:039511040' },
      { name: 'รพ.สต.บ้านหาดเล็ก', district: 'คลองใหญ่', dist: '72 กม.', open: true, tags: ['ฉีดวัคซีน', 'ล่ามภาษากัมพูชา'], tel: 'tel:039511401' },
      { name: 'รพ.สต.อ่าวพร้าว', district: 'เกาะกูด', dist: 'เรือ 1.5 ชม.', open: true, tags: ['ฉีดวัคซีน', 'ส่งต่อทางเรือ'], tel: 'tel:039511501' }
    ];
    const sorted = all.slice().sort((a, b) => parseFloat(a.dist) - parseFloat(b.dist));
    const defs = [['near', 'ใกล้ฉัน'], ['เมืองตราด', 'เมือง'], ['คลองใหญ่', 'คลองใหญ่'], ['เกาะกูด', 'เกาะกูด']];
    const ds = defs.map(([k, label]) => {
      const on = this.state.d === k;
      return { label, pressed: on ? 'true' : 'false', bg: on ? '#10242A' : '#FFFFFF', fg: on ? '#FFFFFF' : '#10242A', ring: on ? '#10242A' : '#E8E1D4', pick: () => this.setState({ d: k }) };
    });
    let items = this.state.d === 'near' ? sorted.filter((c) => c.district === 'เมืองตราด') : sorted.filter((c) => c.district === this.state.d);
    if (this.state.open) items = items.filter((c) => c.open);
    items = items.map((c) => Object.assign({}, c, { status: c.open ? 'เปิดอยู่ ถึง 16:30' : 'ปิดแล้ว', stBg: c.open ? '#E3EFE6' : '#F3EDE2', stFg: c.open ? '#1F4D3A' : '#3B5157' }));
    const open = this.state.open;
    return {
      ds, items, count: items.length,
      openChecked: open ? 'true' : 'false', openBg: open ? '#0E6E7E' : '#C9BFAE', openX: open ? '22px' : '0px',
      toggleOpen: () => this.setState({ open: !open })
    };
  }
}
</script>
</body>
</html>
