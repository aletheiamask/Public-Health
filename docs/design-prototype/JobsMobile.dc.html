<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>สมัครงาน มือถือ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&amp;family=Noto+Sans+Thai+Looped:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit}
a{color:inherit}
.h{font-family:'Anuphan','Noto Sans Thai Looped',sans-serif;letter-spacing:-0.01em}
.press{transition:transform .12s}.press:active{transform:scale(.97)}
@keyframes ring{from{stroke-dashoffset:132}}
.ring{animation:ring 1s cubic-bezier(.2,.7,.2,1) both}
@keyframes slide{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.slide{animation:slide .3s cubic-bezier(.2,.7,.2,1) both}
a:focus-visible,button:focus-visible{outline:3px solid #F4A23C;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</helmet>
<div style="width: 390px; height: 1900px; position: relative; overflow: hidden; background: #FBF7F0; font-family: 'Noto Sans Thai Looped', system-ui, sans-serif; font-size: 18px; line-height: 1.65; color: #10242A;">

  <sc-if value="{{list}}" hint-placeholder-val="{{ true }}">
    <div>
      <div style="position: relative;">
        <img src="/_blob/447b77a9a7557419846a60895069258a" alt="ภาพประกอบ: บัณฑิตสาธารณสุขรุ่นใหม่ 3 คน" style="width: 100%; height: 220px; object-fit: cover; display: block;">
        <a href="HomeMobile.dc.html" class="press" style="position: absolute; left: 14px; top: 14px; height: 48px; padding: 0 16px 0 10px; border-radius: 999px; background: #FFFFFF; text-decoration: none; font-weight: 700; display: flex; gap: 4px; align-items: center;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>กลับ</a>
      </div>
      <div style="margin-top: -24px; position: relative; border-radius: 26px 26px 0 0; background: #FBF7F0; padding: 20px 16px 40px; display: flex; flex-direction: column; gap: 14px;">
        <h1 class="h" style="margin: 0; font-size: 30px; line-height: 1.25;">สมัครงาน</h1>
        <p style="margin: 0; color: #3B5157;">4 ตำแหน่ง 19 อัตรา · สมัครออนไลน์ได้ทั้งหมด</p>
        <a href="Jobs.dc.html" class="press" style="height: 54px; border-radius: 18px; background: #1F4D3A; color: #FFFFFF; text-decoration: none; font-weight: 700; display: flex; gap: 8px; align-items: center; justify-content: center;"><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"></path><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>แจ้งฉันเมื่อมีตำแหน่งใหม่</a>
        <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
          <sc-for list="{{jobs}}" as="j" hint-placeholder-count="4">
            <li>
              <button type="button" class="press" onClick="{{j.open}}" style="width: 100%; text-align: left; padding: 16px; border-radius: 24px; border: 0; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E8E1D4; display: flex; gap: 14px; align-items: center; color: #10242A; cursor: pointer;">
                <svg role="img" aria-label="เหลืออีก {{j.left}} วัน" width="62" height="62" viewBox="0 0 48 48" style="flex: none;"><circle cx="24" cy="24" r="21" fill="none" stroke="#F3EDE2" stroke-width="5"></circle><circle class="ring" cx="24" cy="24" r="21" fill="none" stroke="{{j.color}}" stroke-width="5" stroke-linecap="round" stroke-dasharray="132" stroke-dashoffset="{{j.offset}}" transform="rotate(-90 24 24)"></circle><text x="24" y="23" text-anchor="middle" font-size="13" font-weight="700" fill="#10242A" font-family="Anuphan, sans-serif">{{j.left}}</text><text x="24" y="34" text-anchor="middle" font-size="8" fill="#56696E" font-family="Noto Sans Thai Looped, sans-serif">วัน</text></svg>
                <span style="flex: 1; display: flex; flex-direction: column; line-height: 1.4;"><span class="h" style="font-size: 19px; font-weight: 700;">{{j.title}}</span><span style="font-size: 15px; color: #56696E;">{{j.place}} · {{j.seats}} อัตรา</span><span style="font-size: 15px; font-weight: 700; color: {{j.color}};">ปิดรับ {{j.close}}</span></span>
              </button>
            </li>
          </sc-for>
        </ul>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{detail}}" hint-placeholder-val="{{ false }}">
    <div class="slide">
      <header style="padding: 12px; display: flex; align-items: center; gap: 8px;">
        <button type="button" class="press" onClick="{{back}}" style="height: 48px; padding: 0 16px 0 10px; border-radius: 999px; border: 0; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E8E1D4; font-size: 17px; font-weight: 700; display: flex; gap: 4px; align-items: center; color: #10242A; cursor: pointer;"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"></path></svg>ตำแหน่งทั้งหมด</button>
      </header>
      <div style="padding: 4px 16px 150px; display: flex; flex-direction: column; gap: 16px;">
        <span style="align-self: flex-start; padding: 2px 12px; border-radius: 999px; background: {{s.bg}}; color: {{s.fg}}; font-size: 15px; font-weight: 700;">ปิดรับ {{s.close}} · เหลือ {{s.left}} วัน</span>
        <h1 class="h" style="margin: 0; font-size: 30px; line-height: 1.25;">{{s.title}}</h1>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <div style="padding: 12px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E8E1D4; line-height: 1.35;"><span style="display: block; font-size: 14px; color: #56696E;">เงินเดือน</span><strong>{{s.salary}}</strong></div>
          <div style="padding: 12px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E8E1D4; line-height: 1.35;"><span style="display: block; font-size: 14px; color: #56696E;">รับ</span><strong>{{s.seats}} อัตรา</strong></div>
          <div style="padding: 12px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 1.5px #E8E1D4; line-height: 1.35;"><span style="display: block; font-size: 14px; color: #56696E;">ประเภท</span><strong style="font-size: 15px;">{{s.type}}</strong></div>
        </div>
        <section>
          <h2 class="h" style="margin: 0 0 6px; font-size: 21px;">คุณสมบัติ</h2>
          <ul style="margin: 0; padding-left: 22px; color: #3B5157;"><sc-for list="{{s.req}}" as="r" hint-placeholder-count="3"><li>{{r}}</li></sc-for></ul>
        </section>
        <section>
          <h2 class="h" style="margin: 0 0 6px; font-size: 21px;">ที่ทำงาน</h2>
          <p style="margin: 0; color: #3B5157;">{{s.place}}</p>
        </section>
        <a href="#" class="press" style="height: 52px; border-radius: 16px; background: #F3EDE2; text-decoration: none; font-weight: 700; display: flex; align-items: center; justify-content: center;">อ่านประกาศฉบับเต็ม (PDF 2 หน้า)</a>
      </div>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 16px 22px; background: #FFFFFF; border-radius: 28px 28px 0 0; box-shadow: 0 -12px 30px -16px rgba(10,54,64,.35); display: grid; grid-template-columns: 1fr 2fr; gap: 8px;">
        <button type="button" class="press" style="height: 60px; border-radius: 18px; border: 0; background: #05803A; color: #FFFFFF; font-size: 16px; font-weight: 700;">ส่งให้เพื่อน</button>
        <a href="#" class="press" style="height: 60px; border-radius: 18px; background: #0E6E7E; color: #FFFFFF; text-decoration: none; font-size: 19px; font-weight: 700; display: flex; align-items: center; justify-content: center;">สมัครออนไลน์</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: -1 };
  }
  renderVals() {
    const all = [
      { title: 'เจ้าพนักงานธุรการ', type: 'ลูกจ้างชั่วคราว', place: 'สสจ.ตราด อ.เมือง', seats: 3, salary: '15,000 บาท', close: '9 พ.ย.', left: 5, total: 15, req: ['ปวส. ขึ้นไป', 'ใช้คอมพิวเตอร์และระบบสารบรรณได้ดี', 'ทดสอบการพิมพ์ 30 คำ/นาที'] },
      { title: 'พยาบาลวิชาชีพ', type: 'พนักงาน สธ.', place: 'รพ.สต.เกาะกูด (มีบ้านพัก)', seats: 2, salary: '22,750 บาท', close: '12 พ.ย.', left: 8, total: 15, req: ['ปริญญาตรีพยาบาลศาสตร์', 'ใบอนุญาตการพยาบาลชั้นหนึ่ง', 'พักอาศัยบนเกาะได้'] },
      { title: 'นักวิชาการสาธารณสุข', type: 'พนักงาน สธ.', place: 'สสจ.ตราด และ รพ.สต.', seats: 12, salary: '18,000 บาท', close: '20 พ.ย.', left: 16, total: 15, req: ['ปริญญาตรี สาธารณสุขศาสตร์', 'ใบอนุญาตวิชาชีพการสาธารณสุข', 'ประจำ รพ.สต. บนเกาะได้ จะพิจารณาเป็นพิเศษ'] },
      { title: 'นักวิชาการคอมพิวเตอร์', type: 'ข้าราชการ', place: 'สสจ.ตราด อ.เมือง', seats: 2, salary: '17,500 บาท', close: '30 พ.ย.', left: 26, total: 30, req: ['ปริญญาตรีด้านคอมพิวเตอร์/ไอที', 'ผ่านภาค ก. ของ ก.พ.', 'มีประสบการณ์ Go หรือฐานข้อมูลจะพิจารณาเป็นพิเศษ'] }
    ];
    const jobs = all.map((j, i) => Object.assign({}, j, {
      color: j.left <= 7 ? '#B3123F' : '#0E6E7E',
      offset: Math.round(132 * (1 - Math.min(1, j.left / j.total))),
      open: () => this.setState({ open: i })
    }));
    const o = this.state.open;
    const s = o >= 0 ? all[o] : all[0];
    const urgent = s.left <= 7;
    return {
      jobs, list: o < 0, detail: o >= 0,
      s: Object.assign({}, s, { bg: urgent ? '#FBE4EA' : '#DDF1F1', fg: urgent ? '#8C0E31' : '#0A4B57' }),
      back: () => this.setState({ open: -1 })
    };
  }
}
</script>
</body>
</html>
